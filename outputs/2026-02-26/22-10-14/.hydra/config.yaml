main:
  _base_:
    trainer:
      _target_: basicts.runners.SimpleTimeSeriesForecastingRunner
      num_epochs: 100
      batch_size: 32
      optimizer:
        _target_: torch.optim.Adam
        lr: 0.0005
        weight_decay: 0.01
      lr_scheduler:
        _target_: torch.optim.lr_scheduler.CosineAnnealingLR
        T_max: 100
    metrics:
    - MSE
    - MAE
    seed: 42
    datasets:
      dataset_name: ETTh1
      input_dim: 7
      output_dim: 7
      data_path: ./data/ETTh1/ETTh1.csv
    model:
      model:
        _target_: src.basicts_adapter.mats_arch.MATSArch
        hidden_dim: 256
        use_segment_processing: true
        use_verification: true
        use_rft: true
  experiment:
    name: MATS-Full-ETTh1-96
    type: main
  model:
    pred_len: 96
